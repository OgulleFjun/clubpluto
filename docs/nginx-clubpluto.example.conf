# Nginx – clubpluto.eu och www.clubpluto.eu
# Placera i /etc/nginx/sites-available/clubpluto och aktivera med:
#   sudo ln -s /etc/nginx/sites-available/clubpluto /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certifikat:
#   sudo certbot --nginx -d clubpluto.eu -d www.clubpluto.eu
#
# Webhooken från GitHub är exakt:
#   https://clubpluto.eu/hooks/deploy-clubpluto
# Den får inte svara med en omdirigering till www. En POST som följer
# en 301 tappar innehållet, och deployen körs då inte.
#
# Kontrollera porten mot den live-vhost som redan tar emot
# https://salaspel.se/hooks/deploy-salaspel
#   sudo nginx -T | grep -n hooks -A 12

server {
    listen 80;
    server_name clubpluto.eu www.clubpluto.eu;

    location /hooks/ {
        return 301 https://clubpluto.eu$request_uri;
    }

    location / {
        return 301 https://www.clubpluto.eu$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name clubpluto.eu;
    client_max_body_size 1M;

    # ssl_certificate /etc/letsencrypt/live/clubpluto.eu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/clubpluto.eu/privkey.pem;

    location /hooks/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://www.clubpluto.eu$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.clubpluto.eu;
    client_max_body_size 12M;

    # ssl_certificate /etc/letsencrypt/live/clubpluto.eu/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/clubpluto.eu/privkey.pem;

    root /home/frederick/clubpluto/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
